<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kai</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kai">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#2e333b;--txt:#f2efe9;--mut:#8b919c;--phy:#ff7a3d;--men:#3db8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Rajdhani",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#2a2208 0%,#0b0d12 55%) fixed}
body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:480px;margin:0 auto}
.card{border:2px solid var(--line);border-radius:28px;background:var(--card);padding:20px 16px 24px;margin-top:12px}
h1{margin:4px 0 0;text-align:center;font-size:34px;font-weight:600;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-top:2px}
.hero{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:6px;margin:18px 0 22px}
.side{text-align:center;font-size:13px;color:var(--mut)}
.side b{display:block;font-size:34px;font-weight:700;margin-top:4px}
.side.p b{color:var(--phy)}.side.m b{color:var(--men)}
.cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:8px}
.cols>div:first-child{border-right:1px solid var(--line);padding-right:10px}
.cols>div:last-child{padding-left:10px}
.stat{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;font-size:15px;padding:14px 2px;text-align:left}
.stat:last-child{border-bottom:0}
.stat span:last-child{font-weight:700}
.p .stat span:last-child,.cols>div:first-child .stat span:last-child{color:var(--phy)}
.cols>div:last-child .stat span:last-child{color:var(--men)}
.edit{display:block;margin:18px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;padding:8px}
/* feuille détail */
.sheet-bg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.sheet-bg.on{display:flex}
.sheet{max-height:88vh;overflow:auto;width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 26px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:24px}
.row{padding:12px 0;border-top:1px solid var(--line)}
.row .top{display:flex;justify-content:space-between;font-size:15px}
.row small{color:var(--mut)}
.bar{display:flex;height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%}
.close{margin-top:14px;width:100%}
.zhome{position:relative;padding-top:12px}
.ztro{position:absolute;top:10px;left:0;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:#ffb21a;display:flex;align-items:center;justify-content:center;padding:0}
.zhead h1{margin:0;text-align:center;font-size:38px;letter-spacing:2px;line-height:1}.zhead .sub{letter-spacing:1.5px;margin-top:4px}
.zprog{margin-top:12px}.zpl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.zbar{height:8px;border-radius:4px;background:#262c3a;margin-top:5px;overflow:hidden}.zbar i{display:block;height:100%;background:var(--fc)}
.zpt{text-align:center;font-size:14px;margin-top:6px}
.zhero{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 4px}
.zemb{position:relative;width:176px;height:176px;flex:none;display:flex;align-items:center;justify-content:center}
.zemb::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--fc) 0deg 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 44%,transparent 70%);mask-image:radial-gradient(circle,#000 44%,transparent 70%);opacity:.85}
.zemb>div{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b2410,#0e1016 75%);border:3px solid var(--fc);box-shadow:0 0 36px color-mix(in srgb,var(--fc) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.zemb small{font-size:11px;letter-spacing:3px;color:var(--mut)}.zemb b{font-size:21px;line-height:1.05;color:var(--fc);margin-top:5px}
.zav{width:142px;height:142px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--fc);background:#11141b;box-shadow:0 0 28px color-mix(in srgb,var(--fc) 35%,transparent)}
.zsc{position:relative;margin-top:8px;padding:10px 14px 12px;border:1px solid #5dff9d77;border-radius:14px;background:linear-gradient(180deg,#0b2218,#07110d);box-shadow:0 0 22px #5dff9d2a,inset 0 0 26px #5dff9d1a;text-align:center;overflow:hidden}
.zsc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#5dff9d12 0 1px,transparent 1px 4px);pointer-events:none}
.zt{display:flex;justify-content:space-between;font-size:12px;letter-spacing:3px;color:#5dff9d}
.zl{font-size:13px;letter-spacing:4px;color:#9fe8bf;margin-top:4px}
.zbig{font-size:72px;font-weight:700;line-height:1;color:#5dff9d;text-shadow:0 0 20px #5dff9d99;letter-spacing:2px}
.zmini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #5dff9d44}
.zmini span{display:block;font-size:11px;letter-spacing:1px;color:#9fe8bf}.zmini b{font-size:17px;font-weight:600;color:#5dff9d}
.zlad{display:flex;gap:4px;margin-top:10px}.zlad i{flex:1;height:6px;border-radius:3px}
.zcap{font-size:12px;color:var(--mut);margin-top:5px;letter-spacing:1px;text-align:center}
.zcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.zcard{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--txt);font:inherit}
.zk{font-size:13px;letter-spacing:2px;color:var(--mut)}.zf{font-size:19px;font-weight:700}
.zr{display:flex;justify-content:space-between;font-size:15px;color:var(--mut)}
.zb{display:block;height:6px;border-radius:3px;background:#262c3a;overflow:hidden}.zb i{display:block;height:100%}
.zrow{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-top:8px}
.zrow.cur{background:#231d0c;border-color:#ffb21a}
.zav2{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;border:2px solid;background:#11141b}
.zn{font-size:19px;font-weight:700;line-height:1.1}.zs{font-size:12px;letter-spacing:1.5px}

.go-m{cursor:pointer}.go-m small:last-child{display:block;margin-top:8px}
.up{color:#4cd27a}.dn{color:#ff5d5d}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:0 0 10px}
.addrow{display:flex;gap:8px;margin-top:6px}.addrow input:first-child{flex:1.4}
.x{background:none;border:0;color:var(--mut);font-size:15px;padding:4px 6px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:24px;text-align:center}
.ov.on{display:flex}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(92vw,420px)}
.cd{aspect-ratio:5/7;border-radius:6px;border:1px solid #3a4658;padding:0;font:inherit;font-size:12px;font-weight:700;line-height:1.1;background:repeating-linear-gradient(45deg,#24334d,#24334d 4px,#2d4163 4px,#2d4163 8px)}
.cd.up{background:#f2efe9;color:#14161a}.cd.red{color:#d63a3a}.cd.gone{visibility:hidden}
.mgh{margin-bottom:10px;font-size:15px;color:var(--mut)}.big{font-size:72px;font-weight:700;height:90px;letter-spacing:4px}
.ov input{text-align:center;font-size:28px;max-width:280px;margin:0 auto}
/* formulaire */
form h2{font-size:18px;margin:26px 0 4px}
form h3{font-size:14px;color:var(--mut);font-weight:500;margin:18px 0 2px}
label{display:block;font-size:14px;margin-top:12px}
label small{color:var(--mut)}
input{width:100%;margin-top:5px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;font-size:16px}
input:focus{outline:2px solid var(--men);outline-offset:1px}
button.go{margin-top:28px;width:100%;padding:16px;border:0;border-radius:14px;background:var(--phy);color:#14161a;font:inherit;font-weight:700;font-size:17px}
.btn2{padding:14px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--txt);font:inherit;font-size:16px}
.intro{color:var(--mut);font-size:14px;line-height:1.5;margin:10px 0 0;text-align:center}
.hint{color:var(--mut);font-size:12px;margin:6px 0 0}
[hidden]{display:none!important}
.ztop{display:flex;justify-content:space-between;align-items:center}
.ztro{position:static}
.zmod{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;text-decoration:underline;padding:8px 4px}
#home .zhead{margin-top:-34px}
.zav{width:190px;height:190px;margin:16px auto 0;box-shadow:0 0 44px color-mix(in srgb,var(--fc) 45%,transparent)}
.zfn{text-align:center;font-size:25px;font-weight:700;letter-spacing:2px;color:var(--fc);margin-top:10px}
.zl2{text-align:center;font-size:12px;letter-spacing:4px;color:#9fe8bf;margin-top:8px}
.zbig{font-size:68px;text-align:center}
.zpt{color:var(--mut)}
.zlist{margin-top:14px}
.zst{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;color:var(--txt);font:inherit;text-align:left}
.zst .zk{width:92px}.zst .zb{flex:1;height:8px;border-radius:4px}
.zv{width:70px;text-align:right}.zn2{display:block;font-size:21px;line-height:1}
.zd{display:block;font-size:12px}.zd b{font-weight:600}
.zst .zb{display:flex}
.zd{font-size:13px}
</style>
</head>
<body>
<main>
  <div id="home" class="zhome" hidden>
    <div class="ztop">
      <button class="ztro" id="rankBtn" aria-label="Classement des formes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></button>
      <button class="zmod" id="editBtn">Modifier</button>
    </div>
    <div class="zhead"><h1 id="name"></h1><div class="sub" id="meta"></div></div>
    <div class="zav" id="avf"></div>
    <div class="zfn" id="fn"></div>
    <div class="zl2">NIVEAU DE PUISSANCE</div>
    <div class="zbig" id="pw"></div>
    <div class="zprog"><div class="zbar"><i id="pfill"></i></div><div class="zpt" id="ptxt"></div></div>
    <div class="zlist" id="cards"></div>
  </div>
  <div id="rank" class="zhome" hidden>
    <button class="back" id="rankBack">‹ Retour</button>
    <div class="zhead"><h1>CLASSEMENT</h1><div class="sub">LES 8 FORMES · NIVEAU DE PUISSANCE</div></div>
    <div id="rlist" style="margin-top:14px"></div>
  </div>

  <div class="card" id="setup" hidden>
    <h1>Kai</h1>
    <p class="intro">Remplis ton profil une fois. Laisse vide ce que tu ne connais pas : seules les mesures remplies comptent dans ta note.</p>
    <form id="form" novalidate></form>
  </div>
</main>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="ov"></div>

<script>
/* ===== Barèmes : [valeur, note/100]. Modifie-les librement. ===== */
const T={
 squat:[[0,0],[60,10],[90,22],[120,38],[150,55],[180,72],[210,88],[250,100]],
 bench:[[0,0],[40,10],[60,22],[80,38],[100,55],[120,72],[140,88],[170,100]],
 pull:[[0,0],[2,8],[5,20],[10,38],[15,55],[20,70],[30,90],[40,100]],
 push:[[0,0],[10,8],[25,20],[40,35],[60,55],[80,72],[100,85],[150,100]],
 m100:[[10,100],[10.6,90],[11.5,75],[12.5,55],[13.5,38],[15,20],[17,5],[19,0]],
 m400:[[45,100],[48,90],[54,75],[60,55],[70,35],[85,15],[100,0]],
 k5:[[13,100],[15,90],[18,75],[21,58],[25,40],[30,20],[40,0]],
 k10:[[28,100],[32,90],[38,75],[45,58],[52,40],[62,20],[85,0]],
 vert:[[15,0],[30,15],[40,30],[50,48],[60,65],[70,80],[85,95],[100,100]],
 horiz:[[100,0],[150,10],[190,28],[220,48],[250,68],[280,88],[310,100]],
 calc:[[3,10],[10,40],[20,70],[35,100]],
 elo:[[400,10],[800,30],[1200,50],[1600,70],[2000,90],[2400,100]],
 screen:[[.5,100],[1.5,90],[3,70],[5,45],[7,25],[10,5]],
 sleep:[[4,5],[6,40],[7,75],[8,100],[9,90],[10,60],[11,40]],
 study:[[0,5],[3,25],[7,50],[14,75],[25,95],[35,100]],
 avg:[[5,10],[10,40],[14,70],[17,90],[20,100]],
 pct:[[0,0],[100,100]],
 imc:[[14,0],[16,10],[18,45],[20,80],[22,100],[24,100],[26,75],[28,50],[31,25],[35,8],[40,0]],
 bras:[[25,0],[30,10],[34,25],[38,45],[42,65],[46,85],[50,100]],
 pec:[[80,0],[90,10],[100,28],[108,48],[116,68],[124,88],[132,100]],
 cuisse:[[45,0],[50,10],[56,28],[62,48],[68,68],[74,88],[80,100]],
 waist:[[.35,40],[.40,85],[.43,100],[.46,90],[.50,60],[.55,30],[.60,10],[.70,0]],
 memo:[[27,100],[33,90],[40,75],[48,55],[60,35],[80,10]],
 geo:[[0,0],[25,30],[50,60],[75,85],[100,100]]
};
/* type: n = nombre, t = temps mm:ss ; ratio = divisé par le poids */
const GROUPS={
 physique:{label:"Mesures et performances",stats:[
  {k:"force",label:"Force",m:[
   {id:"squat",label:"Squat (1 répétition max)",unit:"kg",t:"squat"},
   {id:"tractions",label:"Tractions (max d'affilée)",unit:"reps",t:"pull"},
   {id:"pompes",label:"Pompes (max d'affilée)",unit:"reps",t:"push"},
   {id:"bench",label:"Développé couché (1 RM)",unit:"kg",t:"bench"}]},
  {k:"vitesse",label:"Vitesse",m:[
   {id:"t100",label:"100 m",unit:"secondes",t:"m100",ph:"13.2"},
   {id:"t400",label:"400 m",unit:"secondes",t:"m400",ph:"62"}]},
  {k:"endurance",label:"Endurance",m:[
   {id:"t5k",label:"5 km",unit:"mm:ss",t:"k5",time:1,ph:"25:30"},
   {id:"t10k",label:"10 km",unit:"mm:ss",t:"k10",time:1,ph:"55:00"}]},
  {k:"agilite",label:"Agilité",m:[
   {id:"vert",label:"Détente sèche verticale",unit:"cm",t:"vert"},
   {id:"horiz",label:"Détente sèche horizontale",unit:"cm",t:"horiz"}]},
  {k:"physique",label:"Physique",m:[
   {id:"imc",label:"Rapport taille / poids (IMC)",unit:"kg/m²",t:"imc",auto:1},
   {id:"bras",label:"Tour de bras (contracté)",unit:"cm",t:"bras"},
   {id:"pec",label:"Tour de pec",unit:"cm",t:"pec"},
   {id:"tour_taille",label:"Tour de taille",unit:"cm",t:"waist",rel:"taille"},
   {id:"cuisse",label:"Tour de cuisse",unit:"cm",t:"cuisse"}]}]}
};
const FORMS=[
 {n:"Forme de base",min:0,c:"#8b919c",m:"curly",h:"#141414",a:null,e:"#141414"},
 {n:"Kaioken",min:15,c:"#ff4a3d",m:"curly",h:"#141414",a:"#ff4a3d",e:"#141414"},
 {n:"Super Saiyan",min:30,c:"#ffd23f",m:"spiky",h:"#ffd23f",a:"#ffd23f",e:"#20d3c2"},
 {n:"Super Saiyan 2",min:45,c:"#ffb21a",m:"spiky",h:"#ffd23f",a:"#ffb21a",e:"#20d3c2"},
 {n:"Super Saiyan 3",min:60,c:"#ff8a1f",m:"spiky3",h:"#ffcc33",a:"#ff8a1f",e:"#20d3c2"},
 {n:"Super Saiyan God",min:70,c:"#ff2e63",m:"spiky",h:"#ff2e63",a:"#ff2e63",e:"#ff2e63"},
 {n:"Super Saiyan Blue",min:80,c:"#3db8ff",m:"spiky",h:"#3db8ff",a:"#3db8ff",e:"#3db8ff"},
 {n:"Ultra Instinct",min:90,c:"#cfd8ff",m:"spiky",h:"#cfd8ff",a:"#cfd8ff",e:"#cfd8ff"}];
const formIdx=s=>s==null?0:FORMS.reduce((k,f,i)=>s>=f.min?i:k,0);
const formOf=s=>FORMS[formIdx(s)];
const rank=s=>s==null?"–":formOf(s).n;
const pw=s=>s==null?"–":(s*100).toLocaleString("fr-FR");
function avatar(f,size){
  const o=[];
  if(f.a)o.push(`<circle cx="50" cy="50" r="48" fill="${f.a}" opacity=".28"/>`);
  if(f.m==="spiky3")o.push(`<path d="M30 30 L20 80 L37 58Z M70 30 L80 80 L63 58Z" fill="${f.h}"/>`);
  o.push('<path d="M10 100 Q14 72 50 68 Q86 72 90 100Z" fill="#ff7a1a"/><path d="M39 69 L50 91 L61 69 Q50 65 39 69Z" fill="#1f4fd8"/><rect x="10" y="94" width="80" height="6" fill="#1f4fd8"/><rect x="43" y="56" width="14" height="16" rx="4" fill="#9a6641"/><circle cx="31" cy="46" r="4" fill="#a56d47"/><circle cx="69" cy="46" r="4" fill="#a56d47"/><ellipse cx="50" cy="44" rx="19" ry="22" fill="#b57b52"/>');
  if(f.m==="curly"){
    o.push(`<path d="M31 42 Q29 22 50 20 Q71 22 69 42 Q60 31 50 31 Q40 31 31 42Z" fill="${f.h}"/>`);
    [[33,27],[42,20],[52,18],[61,21],[68,28],[30,37],[70,37]].forEach(([x,y])=>o.push(`<circle cx="${x}" cy="${y}" r="7" fill="${f.h}"/>`));
  }else o.push(`<path d="${f.m==="spiky"?"M31 40 L24 20 L37 28 L38 8 L48 25 L56 6 L61 26 L74 12 L70 30 L69 40 Q50 27 31 40Z":"M31 40 L18 16 L36 26 L34 3 L48 22 L58 2 L62 24 L80 10 L70 32 L69 40 Q50 27 31 40Z"}" fill="${f.h}"/>`);
  o.push(`<path d="M38 41 L46 42 M54 42 L62 41" stroke="${f.m==="curly"?"#141414":f.h}" stroke-width="2" stroke-linecap="round"/><ellipse cx="42.5" cy="47" rx="2.6" ry="3" fill="${f.e}"/><ellipse cx="57.5" cy="47" rx="2.6" ry="3" fill="${f.e}"/><path d="M44 55 Q50 59 56 55" stroke="#5a2f1c" stroke-width="2" fill="none" stroke-linecap="round"/>`);
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Avatar ${f.n}" style="display:block">${o.join("")}</svg>`;
}
const $=id=>document.getElementById(id);
const KEY="peak-profile-v1";

function interp(tab,v){
  const t=[...tab].sort((a,b)=>a[0]-b[0]);
  if(v<=t[0][0])return t[0][1]; if(v>=t[t.length-1][0])return t[t.length-1][1];
  for(let i=0;i<t.length-1;i++){const[a,sa]=t[i],[b,sb]=t[i+1];
    if(v>=a&&v<=b)return sa+(sb-sa)*(v-a)/(b-a);}
}
function parseVal(m,raw){
  if(raw==null||String(raw).trim()==="")return null;
  let s=String(raw).trim().replace(",",".");
  if(m.time&&s.includes(":")){const[a,b]=s.split(":");return (+a)+(+b||0)/60}
  const n=parseFloat(s);return isNaN(n)?null:n;
}
function scoreMetric(m,raw,p){
  let v=parseVal(m,raw); if(v==null)return null;
  if(m.ratio){if(!p.poids)return null;v=v/p.poids}
  if(m.max)v=v/m.max*100;
  if(m.rel){if(!p[m.rel])return null;v=v/p[m.rel]}
  return Math.round(interp(T[m.t],v));
}
function avg(a){a=a.filter(x=>x!=null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
const today=()=>new Date().toLocaleDateString("en-CA");
const fmtD=d=>d.split("-").reverse().join("/");
const hist=(p,id)=>p.data[id]||(p.data[id]=[]);
const lastOf=h=>h[h.length-1];
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const colOf=()=>"#ffb21a";
let current=null,view=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(current))}catch(_){}}
function addEntry(p,id,v,d){const h=hist(p,id),i=h.findIndex(e=>e.d===d);if(i>=0)h.splice(i,1);h.push({d,v:String(v)});h.sort((a,b)=>a.d<b.d?-1:1)}

function syncImc(p){
  if(!p.taille||!p.poids)return;
  const v=(p.poids/((p.taille/100)**2)).toFixed(1),l=lastOf(hist(p,"imc"));
  if(!l||l.v!==v)addEntry(p,"imc",v,today());
}
function scoreStat(st,p){
  const items=st.m.map(m=>{const h=hist(p,m.id),l=lastOf(h),f=h[0];
    return{m,h,raw:l?l.v:"",s:l?scoreMetric(m,l.v,p):null,s0:f?scoreMetric(m,f.v,p):null}});
  return{items,score:avg(items.map(i=>i.s)),score0:avg(items.map(i=>i.s0))};
}
function compute(p){
  const out={};
  for(const g in GROUPS){const stats=GROUPS[g].stats.map(st=>({st,...scoreStat(st,p)}));
    out[g]={stats,score:avg(stats.map(s=>s.score))};}
  out.total=out.physique.score;return out;
}
function migrate(p){
  const d={};
  for(const g in GROUPS)for(const st of GROUPS[g].stats)for(const m of st.m){
    let v=p.data[m.id];
    if(typeof v==="string")v=v===""?[]:[{d:today(),v}];
    d[m.id]=Array.isArray(v)?v:[];}
  p.data=d;syncImc(p);return p;
}

/* ===== Formulaire ===== */
function buildForm(p){
  const val=id=>{const l=p&&lastOf(hist(p,id));return l?l.v:""};
  let h=p?`<p class="intro">Si tu changes une valeur, elle est ajoutée comme nouvelle mesure à la date d'aujourd'hui. Ton historique est conservé.</p>`:"";
  h+=`<h2>Toi</h2>
  <label>Prénom<input name="prenom" required value="${p?p.prenom:""}" autocomplete="given-name"></label>
  <label>Date de naissance<input name="naissance" type="date" required value="${p?p.naissance:""}"></label>
  <label>Taille <small>(cm)</small><input name="taille" type="number" inputmode="decimal" required value="${p?p.taille:""}"></label>
  <label>Poids <small>(kg)</small><input name="poids" type="number" inputmode="decimal" required value="${p?p.poids:""}"></label>`;
  for(const g in GROUPS){
    h+=`<h2>${GROUPS[g].label}</h2>`;
    for(const st of GROUPS[g].stats){
      h+=`<h3>${st.label}</h3>`;
      if(st.k==="physique")h+=`<p class="hint">Mesure-toi avec un mètre ruban : bras contracté, pec au repos, taille au nombril, cuisse à mi-hauteur. Le rapport taille / poids est calculé avec ta taille et ton poids.</p>`;
      for(const m of st.m){
        if(m.auto)continue;if(m.test){h+=`<p class="hint">${m.label} : à faire dans l'app, depuis la fiche ${st.label}.</p>`;continue}
        h+=`<label>${m.label} <small>${m.unit?"("+m.unit+")":""}</small><input name="${m.id}" inputmode="${m.time?"text":"decimal"}" placeholder="${m.ph||""}" value="${val(m.id)}"></label>`;
      }
    }
  }
  h+=`<button class="go" type="submit">${p?"Enregistrer":"Créer mon profil"}</button>`;
  if(p)h+=`<button class="btn2 close" type="button" id="cancel">Annuler</button>`;
  $("form").innerHTML=h;
  if(p)$("cancel").onclick=()=>show("home");
}
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(e.target),g=k=>fd.get(k);
  if(!g("prenom").trim()||!g("naissance")||!+g("taille")||!+g("poids")){
    alert("Renseigne le prénom, la date de naissance, la taille et le poids.");return;}
  const p=current||{data:{}};
  Object.assign(p,{prenom:g("prenom").trim(),naissance:g("naissance"),taille:+g("taille"),poids:+g("poids")});
  for(const gr in GROUPS)for(const st of GROUPS[gr].stats)for(const m of st.m){
    if(m.test||m.auto)continue;
    const v=g(m.id).trim();if(v==="")continue;
    const l=lastOf(hist(p,m.id));if(!l||l.v!==v)addEntry(p,m.id,v,today());
  }
  syncImc(p);current=p;save();render(p);scrollTo(0,0);
});

/* ===== Accueil ===== */
function segs(s0,s,col){
  if(s==null)return"";
  if(s0==null||s0===s)return`<i style="width:${s}%;background:${col}"></i>`;
  const lo=Math.min(s0,s),hi=Math.max(s0,s);
  return`<i style="width:${lo}%;background:${col}"></i><i style="width:${hi-lo}%;background:${s>s0?"#4cd27a":"#ff5d5d"}"></i>`;
}
function render(p){
  current=p;const r=compute(p),sc=r.total??0,i=formIdx(sc),f=FORMS[i],nx=FORMS[i+1];
  $("home").style.setProperty("--fc",f.c);
  $("name").textContent=p.prenom;
  const age=Math.floor((Date.now()-new Date(p.naissance))/31557600000);
  $("meta").textContent=`GUERRIER · ${age} ANS · ${p.taille} CM · ${p.poids} KG`;
  $("avf").innerHTML=avatar(f,184);$("fn").textContent=f.n.toUpperCase();
  $("pw").textContent=pw(sc);
  $("pfill").style.width=(nx?Math.max(0,Math.min(100,(sc-f.min)/(nx.min-f.min)*100)):100)+"%";
  $("ptxt").textContent=nx?`Encore ${pw(nx.min-sc)} avant ${nx.n}`:"Tu as atteint la forme ultime";
  $("cards").innerHTML=r.physique.stats.map(s=>{const fo=formOf(s.score);
    return`<button class="zst" data-k="${s.st.k}"><span class="zk">${s.st.label.toUpperCase()}</span><span class="zb">${segs(s.score0,s.score,fo.c)}</span><span class="zv"><b class="zn2">${pw(s.score)}</b><span class="zd">${delta(s.score0,s.score)}</span></span></button>`}).join("");
  document.querySelectorAll(".zst").forEach(b=>b.onclick=()=>openStat("physique",b.dataset.k));
  show("home");
}
function renderRank(){
  const i=formIdx(compute(current).total??0);
  $("rlist").innerHTML=FORMS.map((f,j)=>j).reverse().map(j=>{const f=FORMS[j],st=j>i?0:j===i?1:2;
    const rg=`${pw(f.min)} – ${j<7?pw(FORMS[j+1].min-1):"10 000"}`;
    return`<div class="zrow${st===1?" cur":""}"><div class="zav2" style="border-color:${f.c}">${avatar(f,42)}</div><div style="flex:1"><div class="zn" style="color:${st?"var(--txt)":"var(--mut)"}">${f.n}</div><small style="color:var(--mut)">Puissance ${rg}</small></div><span class="zs" style="color:${["#9aa1ad","#ffb21a","#4cd27a"][st]}">${["VERROUILLÉE","ACTUELLE","DÉBLOQUÉE"][st]}</span></div>`}).join("");
}
function show(w){$("home").hidden=w!=="home";$("setup").hidden=w!=="setup";$("rank").hidden=w!=="rank"}
$("rankBtn").onclick=()=>{renderRank();show("rank");scrollTo(0,0)};
$("rankBack").onclick=()=>show("home");
const closeSheet=()=>$("sheetBg").classList.remove("on");
$("sheetBg").onclick=e=>{if(e.target.id==="sheetBg")closeSheet()};
$("editBtn").onclick=()=>{buildForm(current);show("setup");scrollTo(0,0)};

/* ===== Fiches ===== */
const ST=(g,k)=>compute(current)[g].stats.find(s=>s.st.k===k);
function delta(a,b){if(a==null||b==null||a===b)return"";const d=b-a;return `<b class="${d>0?"up":"dn"}">${d>0?"+":""}${d*100}</b>`}
function barHTML(s0,s,col){
  if(s==null)return`<div class="bar"></div>`;
  if(s0==null||s0===s)return`<div class="bar"><i style="width:${s}%;background:${col}"></i></div>`;
  const lo=Math.min(s0,s),hi=Math.max(s0,s);
  return`<div class="bar"><i style="width:${lo}%;background:${col}"></i><i style="width:${hi-lo}%;background:${s>s0?"#4cd27a":"#ff5d5d"}"></i></div>`;
}
function openStat(g,k){
  view={g,k};const s=ST(g,k),col=colOf(g);
  let h=`<h2>${s.st.label} · ${rank(s.score)}</h2><small style="color:var(--mut)">Puissance : ${s.score==null?"non renseignée":pw(s.score)}</small> ${delta(s.score0,s.score)}`;
  for(const i of s.items){
    const shown=i.raw!==""?`${i.raw} ${i.m.unit}`:"non renseigné";
    h+=`<div class="row go-m" data-m="${i.m.id}" role="button"><div class="top"><span>${i.m.label}</span><b>${pw(i.s)}</b></div>
    <small>${shown}${i.s!=null?" · "+rank(i.s):""}</small> ${delta(i.s0,i.s)}
    ${barHTML(i.s0,i.s,col)}<small>Historique et nouvelle mesure ›</small></div>`;
  }
  h+=`<button class="btn2 close" id="closeSheet">Fermer</button>`;
  $("sheet").innerHTML=h;$("sheetBg").classList.add("on");
  $("closeSheet").onclick=closeSheet;
  document.querySelectorAll(".go-m").forEach(r=>r.onclick=()=>openMetric(g,k,r.dataset.m));
}
function chart(i,col){
  const pts=i.h.map(e=>({t:new Date(e.d).getTime(),s:scoreMetric(i.m,e.v,current)})).filter(q=>q.s!=null);
  if(!pts.length)return"";
  const W=300,H=130,L=38,R=12,Tp=16,B=22,t0=pts[0].t,t1=pts[pts.length-1].t,n1=pts.length-1;
  const X=(q,n)=>L+(W-L-R)*(n1===0?.5:(t1===t0?n/n1:(q.t-t0)/(t1-t0)));
  const Y=s=>Tp+(H-Tp-B)*(1-s/100),UP="#4cd27a",DN="#ff5d5d";
  let o=[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2e333b"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8b919c">${v*100}</text>`).join("");
  pts.forEach((q,n)=>{if(n){const a=pts[n-1];o+=`<line x1="${X(a,n-1)}" y1="${Y(a.s)}" x2="${X(q,n)}" y2="${Y(q.s)}" stroke="${q.s>=a.s?UP:DN}" stroke-width="3" stroke-linecap="round"/>`}});
  pts.forEach((q,n)=>{const c=n===0?col:(q.s>=pts[n-1].s?UP:DN);
    o+=`<circle cx="${X(q,n)}" cy="${Y(q.s)}" r="4.5" fill="${c}"/><text x="${X(q,n)}" y="${Y(q.s)-9}" text-anchor="middle" font-size="10" fill="#f2efe9">${q.s*100}</text>`});
  o+=`<text x="${L}" y="${H-5}" font-size="10" fill="#8b919c">${fmtD(i.h[0].d)}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10" fill="#8b919c">${fmtD(lastOf(i.h).d)}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin:14px 0 4px" role="img" aria-label="Courbe de progression">${o}</svg>`;
}
function openMetric(g,k,id){
  view={g,k,id};const s=ST(g,k),i=s.items.find(x=>x.m.id===id),m=i.m,col=colOf(g);
  let h=`<button class="back" id="back">‹ ${s.st.label}</button><h2>${m.label}</h2>
  <small style="color:var(--mut)">${i.s==null?"Aucune mesure":`Dernière : ${i.raw} ${m.unit} · ${pw(i.s)} · ${rank(i.s)}`}</small> ${delta(i.s0,i.s)}
  ${chart(i,col)}`;
  h+=m.link?`<p class="hint">Fais le test sur <a href="https://www.jetpunk.com" target="_blank" rel="noopener" style="color:var(--men)">jetpunk.com</a>, puis entre ton résultat ci-dessous.</p>`:"";
  h+=m.auto?`<p class="hint" style="margin-top:12px">Calculé automatiquement avec ta taille et ton poids. Mets-les à jour avec « Modifier » sur l'accueil.</p>`:m.test?`<button class="go" id="runTest" style="margin-top:12px">Faire le test</button>`
   :`<div class="addrow"><input id="nv" inputmode="${m.time?"text":"decimal"}" placeholder="Nouvelle valeur (${m.unit})"><input id="nd" type="date" value="${today()}"></div><button class="go" id="addBtn" style="margin-top:12px">Ajouter cette mesure</button>`;
  h+=`<div style="margin-top:18px">`+i.h.slice().reverse().map(e=>{const sc=scoreMetric(m,e.v,current);
    return`<div class="row"><div class="top"><span>${fmtD(e.d)}</span><span>${e.v} ${m.unit} · ${pw(sc)} <button class="x" data-d="${e.d}" aria-label="Supprimer">✕</button></span></div></div>`}).join("")+`</div>`;
  $("sheet").innerHTML=h;$("sheetBg").classList.add("on");
  $("back").onclick=()=>openStat(g,k);
  if(m.auto){}
  else $("addBtn").onclick=()=>{const v=$("nv").value.trim();
    if(parseVal(m,v)==null){alert("Entre une valeur valide.");return}
    addEntry(current,id,v,$("nd").value||today());save();render(current);openMetric(g,k,id)};
  document.querySelectorAll(".x").forEach(b=>b.onclick=()=>{
    if(!confirm("Supprimer cette mesure ?"))return;
    const hh=hist(current,id);hh.splice(hh.findIndex(e=>e.d===b.dataset.d),1);save();render(current);openMetric(g,k,id)});
}

/* ===== Démarrage ===== */
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(_){}
if(saved){current=migrate(saved);buildForm(current);render(current)}else{buildForm(null);show("setup")}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
